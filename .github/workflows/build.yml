name: Сборка .exe и .apk

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    name: Версия
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        # MAJOR.MINOR из package.json, PATCH = номер запуска: каждая сборка из main — новая версия для обновлений
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            BASE=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
            echo "version=${BASE}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

  windows:
    name: Windows (.exe)
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/set-version.js ${{ needs.version.outputs.version }}
      - name: Сборка установщика и portable
        run: npx electron-builder --win --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: SQUAD-SOUND-windows
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          if-no-files-found: error

  android:
    name: Android (.apk)
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: node scripts/set-version.js ${{ needs.version.outputs.version }}
      - name: Ключ подписи APK
        # Постоянный ключ из секрета ANDROID_KEYSTORE_B64 (alias androiddebugkey, пароль android):
        # без него каждая сборка подписана новым ключом и не ставится поверх старой.
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "::error::Нет секрета ANDROID_KEYSTORE_B64 — релизный APK нельзя подписать постоянным ключом"
            exit 1
          else
            echo "::warning::Нет секрета ANDROID_KEYSTORE_B64 — тестовый APK подписан случайным ключом"
          fi
      - name: Подготовка проекта Capacitor
        run: npm run android:prepare
        env:
          VERSION_CODE: ${{ github.run_number }}
      - name: Сборка APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Переименование
        run: |
          VERSION=${{ needs.version.outputs.version }}
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/SQUAD-SOUND-${VERSION}-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: SQUAD-SOUND-android
          path: dist/*.apk
          if-no-files-found: error

  release:
    name: Релиз на GitHub
    if: github.event_name == 'push'
    needs: [version, windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: SQUAD SOUND v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: out/*
          body: |
            **Windows:** `SQUAD-SOUND-…-setup.exe` — установщик, `SQUAD-SOUND-…-portable.exe` — без установки.
            **Android:** `SQUAD-SOUND-…-android.apk` — установите, разрешив установку из неизвестных источников.

            Дальше обновляться вручную не нужно: установщик Windows скачивает новые версии сам, а Android и portable показывают кнопку «Скачать» при выходе новой версии.
