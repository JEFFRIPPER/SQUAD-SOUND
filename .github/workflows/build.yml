name: Сборка .exe и .apk

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    name: Версия
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        # MAJOR.MINOR из package.json, PATCH = номер запуска: каждая сборка из main — новая версия для обновлений
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            BASE=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
            echo "version=${BASE}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

  windows:
    name: Windows (.exe)
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/set-version.js ${{ needs.version.outputs.version }}
      - name: Сборка установщика и portable
        run: npx electron-builder --win --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: SQUAD-SOUND-windows
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          if-no-files-found: error

  android:
    name: Android (.apk)
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: node scripts/set-version.js ${{ needs.version.outputs.version }}
      - name: Ключ подписи APK
        # Постоянный ключ из секрета ANDROID_KEYSTORE_B64 (alias androiddebugkey, пароль android):
        # без него каждая сборка подписана новым ключом и не ставится поверх старой.
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          # Gradle не всегда берёт ~/.android/debug.keystore (на раннере свой каталог Android),
          # поэтому путь к ключу передаём сборке явно через android.injected.signing.*
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/squad.keystore"
            echo "SIGN_ARGS=-Pandroid.injected.signing.store.file=$RUNNER_TEMP/squad.keystore -Pandroid.injected.signing.store.password=android -Pandroid.injected.signing.key.alias=androiddebugkey -Pandroid.injected.signing.key.password=android" >> "$GITHUB_ENV"
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "::error::Нет секрета ANDROID_KEYSTORE_B64 — релизный APK нельзя подписать постоянным ключом"
            exit 1
          else
            echo "::warning::Нет секрета ANDROID_KEYSTORE_B64 — тестовый APK подписан случайным ключом"
          fi
      - name: Подготовка проекта Capacitor
        run: npm run android:prepare
        env:
          VERSION_CODE: ${{ github.run_number }}
      - name: Сборка APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon $SIGN_ARGS
      - name: Проверка подписи APK
        # Каждый релиз должен быть подписан одним и тем же ключом, иначе обновление не встанет поверх
        if: env.SIGN_ARGS != ''
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          GOT=$("$APKSIGNER" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | grep -m1 'SHA-256' | awk '{print $NF}')
          WANT=$(keytool -list -v -keystore "$RUNNER_TEMP/squad.keystore" -storepass android -alias androiddebugkey | grep -m1 'SHA256:' | awk '{print $NF}' | tr -d ':' | tr 'A-F' 'a-f')
          echo "APK: $GOT"
          echo "Ключ: $WANT"
          [ "$GOT" = "$WANT" ] || { echo "::error::APK подписан не постоянным ключом"; exit 1; }
      - name: Переименование
        run: |
          VERSION=${{ needs.version.outputs.version }}
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/SQUAD-SOUND-${VERSION}-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: SQUAD-SOUND-android
          path: dist/*.apk
          if-no-files-found: error

  release:
    name: Релиз на GitHub
    if: github.event_name == 'push'
    needs: [version, windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      # «Что нового» = заголовок коммита (название слитого PR); приложение показывает его в панели обновления
      - id: notes
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: echo "title=$(printf '%s' "$MSG" | head -n1 | sed 's/ (#[0-9]*)$//')" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: SQUAD SOUND v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: out/*
          body: |
            **Что нового:** ${{ steps.notes.outputs.title }}

            **Windows:** `SQUAD-SOUND-…-setup.exe` — установщик, `SQUAD-SOUND-…-portable.exe` — без установки.
            **Android:** `SQUAD-SOUND-…-android.apk` — установите, разрешив установку из неизвестных источников.

            Дальше обновляться вручную не нужно: приложение само находит новую версию и показывает кнопку «Обновить». Установщик Windows и Android скачивают её внутри приложения, portable-версия открывает файл на GitHub.
